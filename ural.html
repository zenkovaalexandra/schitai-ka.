:root{--ink:#173d42;--accent:#167b69;--cream:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#eaf6f0;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;color:inherit;font-weight:750;min-height:52px;border-radius:18px;padding:12px 19px;background:white;transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-2px);box-shadow:0 6px 15px #173d4220}button:focus-visible,a:focus-visible,summary:focus-visible{outline:4px solid #ffb92d;outline-offset:4px}button:disabled{cursor:default;opacity:.6;transform:none}.primary{background:var(--accent);color:white}.soft{background:#eaf3f0}.eyebrow{font-size:12px;font-weight:850;letter-spacing:2px;text-transform:uppercase;color:#597b78}header{max-width:1240px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:20px 28px}.brand{font-size:19px;font-weight:850;display:flex;align-items:center;gap:11px}.brandmark{display:grid;place-items:center;background:#1b8772;color:#fff;border-radius:18px;width:48px;height:48px;font-size:27px}.nav{display:flex;gap:9px;flex-wrap:wrap}.nav button{font-size:14px}main{max-width:1240px;margin:auto;padding:0 28px 32px}h1{font-size:clamp(32px,4vw,58px);line-height:1.08;letter-spacing:-1.8px;margin:14px 0}h2{font-size:clamp(25px,3vw,38px);line-height:1.2;margin:12px 0}p{line-height:1.65}small{line-height:1.5}.hero{position:relative;border-radius:32px;overflow:hidden;background:#bfe9ed;min-height:300px;padding:40px;isolation:isolate}.hero .scenery{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.hero-copy{max-width:650px}.hero-copy p{font-size:18px;max-width:510px}.pill{display:inline-block;background:#ffffffc9;border-radius:30px;padding:8px 15px;font-size:13px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin:24px 0}.people{display:flex;flex-direction:column;align-items:start;text-align:left;padding:0;overflow:hidden;border-radius:24px;background:white;box-shadow:0 4px 0 #dce8df}.people .picture{width:100%;height:125px;background:var(--tint);display:flex;align-items:center;justify-content:center;overflow:hidden}.people .picture svg{height:140px;width:190px;transform:translateY(14px)}.people .copy{padding:17px;width:100%}.people strong{display:block;font-size:23px;margin-bottom:5px}.people small{display:block;font-weight:500;color:#5d7677;font-size:13px}.meter{height:6px;border-radius:6px;background:#e9eeea;overflow:hidden;margin-top:15px}.meter span{height:100%;display:block;background:var(--color)}.section-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:24px 0 0}.muted{color:#5d7677}.intro-note{font-size:14px;max-width:900px}.route-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px 36px;border-radius:30px;background:linear-gradient(120deg,#fff8db,#d9f0ed)}.route-head p{margin:0}.route-head .avatar{width:190px;flex-shrink:0}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}.topic{position:relative;text-align:left;padding:20px;border-radius:26px;box-shadow:0 5px 0 #d7e5df;background:white}.topic .art{height:135px;border-radius:18px;background:var(--tint);display:grid;place-items:center;margin-bottom:14px}.art svg{width:95%;height:100%}.topic strong{font-size:22px;display:block}.topic small{font-weight:500;color:#5d7677}.check{position:absolute;top:13px;right:13px;background:#167b69;color:white;border:3px solid white;border-radius:50%;width:29px;height:29px;display:grid;place-items:center}.lesson{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;background:var(--cream);border-radius:30px;margin-top:20px;padding:32px}.lesson-art{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(150deg,#d8f3ed,#fff0ce);border-radius:25px;min-height:320px;align-items:center;padding:20px}.lesson-art svg{width:100%;max-height:280px}.caption{font-size:12px;color:#597b78;text-align:center}.story{font-size:21px}.greeting{font-size:clamp(30px,5vw,55px);overflow-wrap:anywhere}.activities{margin-top:26px;padding:25px;background:white;border-radius:25px;box-shadow:0 4px 0 #dce8df}.answers{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.answers button{background:#edf4f1;border:2px solid transparent;min-width:120px;font-size:20px;flex:1}.answers button.correct{background:#d3f1df;border-color:#218663}.answers button.wrong{background:#fff0d3;border-color:#e6ac49}.feedback{min-height:30px;font-weight:700;margin:18px 0 0}.bottom{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:22px}.status{padding:9px 14px;border-radius:18px;background:#fff1bd;font-size:13px}.album{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:25px}.album-card{padding:24px;background:white;border-radius:22px}.stickers{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.sticker{width:52px;height:52px;border-radius:17px;background:#f1f4ef;display:grid;place-items:center;font-size:24px;filter:grayscale(1);opacity:.3}.sticker.earned{filter:none;opacity:1;background:#fff0b3}.teacher{background:white;border-radius:24px;padding:25px;margin-top:20px}.teacher li{margin:10px 0;line-height:1.6}.teacher a{color:#166b62}.teacher label{display:block;margin:18px 0 7px;font-weight:750}.teacher input{display:block;max-width:100%;margin:10px 0}.teacher .block{border-top:1px solid #dee9e3;padding-top:17px;margin-top:20px}.speech-note{font-size:13px;color:#647d78;margin:10px 0}.back{margin-top:12px}.footer{margin:28px 0 0;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:#617c76}.footer a{color:inherit}.rhythm{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.step{background:#f0f1e8;border-radius:14px;padding:12px;font-weight:700}.step.done{background:#c6efd4}.step.current{outline:3px solid #f3b53b}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#163e39;color:white;padding:14px 22px;border-radius:20px;max-width:90vw;z-index:20;box-shadow:0 8px 40px #0002}#toast:empty{display:none}@media(min-width:1500px){main,header{max-width:1450px}button{min-height:62px}.story{font-size:25px}.topic .art{height:170px}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.topics{grid-template-columns:repeat(2,1fr)}.hero{padding:30px}.hero-copy{max-width:80%}.lesson{grid-template-columns:1fr}.lesson-art{min-height:220px}.lesson-art svg{height:220px}}@media(max-width:560px){header{padding:16px;align-items:start}.brand{font-size:15px}.brandmark{display:none}.nav{justify-content:end;gap:5px}.nav button{padding:8px 10px;min-height:45px;font-size:12px}main{padding:0 14px 20px}.hero{padding:25px;min-height:340px}.hero-copy{max-width:100%}.hero-copy p{font-size:16px}.hero h1{font-size:38px}.grid{gap:12px}.people .picture{height:100px}.people .copy{padding:13px}.people strong{font-size:19px}.route-head{padding:25px}.route-head .avatar{display:none}.topics{gap:12px}.topic{padding:13px}.topic strong{font-size:18px}.topic .art{height:110px}.lesson{padding:18px;gap:17px}.story{font-size:19px}.activities{padding:19px}.answers{flex-direction:column}.answers button{width:100%}.album{grid-template-columns:1fr}.section-row{align-items:start}.section-row h2{font-size:23px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style></head><body><header><div class="brand"><span class="brandmark" aria-hidden="true">↟</span><span>Урал:<br>давай знакомиться!</span></div><nav class="nav" aria-label="Основная навигация"><button data-action="home">Народы Урала</button><button data-action="album">✦ Мои открытия</button><button data-action="teacher">Для педагога</button></nav></header><main id="app"></main><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const DATA=[{"id": "ru", "name": "Русские", "color": "#f26a4f", "tag": "Изба, блины и хоровод", "cards": [{"title": "Здравствуйте!", "text": "Так можно поздороваться на русском языке. По-русски это значит «Здравствуйте». Улыбнись и помаши новому другу!", "art": "hello", "q": "Что мы делаем при встрече?", "answers": ["Здороваемся", "Прощаемся", "Засыпаем"], "source": "https://ar.culture.ru/ru/article/krestyanskiy-byt-russkaya-izba-i-podvore", "kind": "choice"}, {"title": "В старинной избе", "text": "В старину многие семьи жили в деревянных избах. Печь согревала дом, в ней готовили еду. Сегодня люди живут и в квартирах, и в частных домах.", "art": "house", "q": "Что помогало согреть избу?", "answers": ["Печь", "Веер", "Зонтик"], "source": "https://ar.culture.ru/ru/article/krestyanskiy-byt-russkaya-izba-i-podvore", "kind": "choice"}, {"title": "Блины к столу", "text": "На Масленицу принято печь блины и угощать родных и гостей. Блины есть и в кухнях других народов!", "art": "pancakes", "q": "К какому празднику в нашем рассказе пекут блины?", "answers": ["К Масленице", "К Дню космонавтики", "К Дню рыбака"], "source": "https://ar.culture.ru/en/exhibition/vereteno-vremeni", "kind": "choice"}, {"title": "Балалайка", "text": "У балалайки треугольный корпус и три струны. Музыкант касается струн пальцами, и инструмент звучит.", "art": "balalaika", "q": "Сколько струн у балалайки?", "answers": ["3", "5", "7"], "source": "https://ar.culture.ru/ru/subject/balalayka-9", "kind": "choice"}, {"title": "Пора подвигаться!", "text": "В хороводе участники двигаются вместе по кругу. Для нашей разминки достаточно небольшого свободного места рядом с экраном.", "art": "dance", "q": "Игровая разминка: повтори последовательность. Это упражнение, а не запись народного танца.", "answers": ["Хлопок", "Шаг", "Хлопок"], "source": "https://ar.culture.ru/en/exhibition/vereteno-vremeni", "kind": "rhythm"}, {"title": "Масленица", "text": "На Масленицу провожают зиму: встречаются с близкими, поют, играют и угощаются блинами.", "art": "sun", "q": "Какое время года провожают?", "answers": ["Зиму", "Лето", "Осень"], "source": "https://ar.culture.ru/en/exhibition/vereteno-vremeni", "kind": "choice"}]}, {"id": "ba", "name": "Башкиры", "color": "#198e73", "tag": "Юрта, курай и Сабантуй", "cards": [{"title": "Сәләм!", "text": "Так можно поздороваться на башкирском языке. По-русски это значит «Привет». Улыбнись и помаши новому другу!", "art": "hello", "q": "Что мы делаем при встрече?", "answers": ["Здороваемся", "Прощаемся", "Засыпаем"], "source": "https://basic.bashlang.ru/vocabulary/topic/1/", "kind": "choice"}, {"title": "Традиционная юрта", "text": "Юрта — переносное жилище. Её использовали при кочевом образе жизни. Сейчас юрты можно увидеть на праздниках и в музеях, а башкирские семьи живут и в современных домах.", "art": "yurt", "q": "Какое жилище можно было переносить?", "answers": ["Юрту", "Многоэтажку", "Каменный замок"], "source": "https://www.somb.ru/virtualnaya-gostinaya-4/virtualnye-programmy/663-bashkiry.html", "kind": "choice"}, {"title": "Бишбармак", "text": "Одно из традиционных угощений — бишбармак. Его готовят с мясом и кусочками теста. В разных семьях рецепты могут отличаться.", "art": "platter", "q": "Что есть в этом блюде?", "answers": ["Кусочки теста", "Шоколадные шарики", "Мороженое"], "source": "https://www.somb.ru/virtualnaya-gostinaya-4/virtualnye-programmy/663-bashkiry.html", "kind": "choice"}, {"title": "Курай", "text": "Курай — духовой инструмент. Традиционно его делали из полого стебля растения. Чтобы он зазвучал, музыкант вдувает воздух.", "art": "flute", "q": "Как извлекают звук из курая?", "answers": ["Дуют", "Нажимают клавиши", "Ударяют палочками"], "source": "https://ar.culture.ru/ru/subject/kuray-1", "kind": "choice"}, {"title": "Пора подвигаться!", "text": "У башкир есть народные и сценические танцы. Один из известных сценических танцев — «Семь девушек». А сейчас поиграем в повторение движений.", "art": "dance", "q": "Игровая разминка: повтори последовательность. Это упражнение, а не запись народного танца.", "answers": ["Хлопок", "Шаг", "Хлопок"], "source": "https://www.culture.ru/events/3127515/koncert-ansamblya-narodnogo-tanca-im-faizi-gaskarova-tancy-narodov-mira", "kind": "rhythm"}, {"title": "Сабантуй", "text": "Сабантуй связан с завершением весенних полевых работ. На нём поют, играют и состязаются. Этот праздник есть и у башкир, и у татар.", "art": "flags", "q": "Какие работы завершали перед праздником?", "answers": ["Весенние полевые", "Строительство корабля", "Уборку снега"], "source": "https://www.culture.ru/s/vopros/sabantuy/", "kind": "choice"}]}, {"id": "ta", "name": "Татары", "color": "#0f91b6", "tag": "Эчпочмак и праздник дружбы", "cards": [{"title": "Исәнмесез!", "text": "Так можно поздороваться на татарском языке. По-русски это значит «Здравствуйте». Улыбнись и помаши новому другу!", "art": "hello", "q": "Что мы делаем при встрече?", "answers": ["Здороваемся", "Прощаемся", "Засыпаем"], "source": "https://mon.tatarstan.ru/file/pub/pub_5023643.pdf", "kind": "choice"}, {"title": "Дом и красивые ткани", "text": "В традиционном татарском доме важное место занимали ткани и украшение комнат. В музее можно увидеть обстановку старого дома. Сегодня семьи живут и в городах, и в сёлах.", "art": "house", "q": "Где можно увидеть старинную обстановку?", "answers": ["В музее", "На облаке", "На дне моря"], "source": "https://ethnomuseum.ru/exposition/permanent/volga_urals/", "kind": "choice"}, {"title": "Эчпочмак", "text": "Эчпочмак — треугольный пирожок. В начинке бывают мясо, картофель и лук. Его название связано с тремя углами.", "art": "triangle", "q": "Сколько углов у эчпочмака?", "answers": ["3", "4", "0"], "source": "https://tatarica.org/ru/razdely/narody/tatary/tatarskaya-kuhnya/echpochmak", "kind": "choice"}, {"title": "Песня и музыка", "text": "В татарской народной музыке есть песни и танцевальные напевы. В хороводных играх пение помогает участникам двигаться вместе.", "art": "notes", "q": "Что помогает двигаться вместе?", "answers": ["Ритм музыки", "Шум пылесоса", "Тишина в шкафу"], "source": "https://tatarica.org/ru/razdely/narody/tatary/tatarskaya-narodnaya-muzyka/narodnaya-muzyka", "kind": "choice"}, {"title": "Пора подвигаться!", "text": "В татарских хороводных играх участники могут идти по кругу, петь и хлопать. Наша разминка тренирует внимание к последовательности.", "art": "dance", "q": "Игровая разминка: повтори последовательность. Это упражнение, а не запись народного танца.", "answers": ["Хлопок", "Шаг", "Хлопок"], "source": "https://tatarica.org/ru/razdely/narody/tatary/tatarskaya-narodnaya-muzyka/narodnaya-muzyka", "kind": "rhythm"}, {"title": "Встречаем Сабантуй", "text": "Сабантуй — праздник с играми и состязаниями после весенних полевых работ. Его отмечают и татары, и башкиры. На празднике интересно встречаться с друзьями.", "art": "flags", "q": "У каких двух народов есть Сабантуй?", "answers": ["У татар и башкир", "Только у татар", "Только у башкир"], "source": "https://www.culture.ru/s/vopros/sabantuy/", "kind": "choice"}]}, {"id": "ud", "name": "Удмурты", "color": "#a15ad7", "tag": "Перепечи и звонкие струны", "cards": [{"title": "Ӟечбуресь!", "text": "Так можно поздороваться на удмуртском языке. По-русски это значит «Здравствуйте». Улыбнись и помаши новому другу!", "art": "hello", "q": "Что мы делаем при встрече?", "answers": ["Здороваемся", "Прощаемся", "Засыпаем"], "source": "https://kpolibrary.ucoz.ru/publ/likhachevskie_chtenija_ii/osobennosti_rechevogo_ehtiketa_udmurtov_v_respublike_tatarstan/3-1-0-347", "kind": "choice"}, {"title": "Дом и кенос", "text": "В удмуртском дворе кроме дома могли стоять хозяйственные постройки. Кенос — амбар для хранения вещей. Сегодня старинный быт изучают в музеях.", "art": "house", "q": "Для чего служил амбар?", "answers": ["Хранить вещи", "Ловить облака", "Кататься с горки"], "source": "https://ethnomuseum.ru/exposition/permanent/volga_urals/", "kind": "choice"}, {"title": "Перепечи", "text": "Перепечи похожи на маленькие открытые корзиночки из теста. Внутрь кладут начинку, например капусту или грибы.", "art": "tarts", "q": "Где у перепечей начинка?", "answers": ["В открытой середине", "На ручке чашки", "Под тарелкой"], "source": "https://www.culture.ru/live/movies/62436/kraevedcheskii-chas-nacionalnoe-blyudo-perepechi", "kind": "choice"}, {"title": "Крезь", "text": "Крезь — струнный музыкальный инструмент. Его деревянный корпус помогает звуку стать слышнее. На небольших крезях играли на праздниках.", "art": "strings", "q": "Что есть у крезя?", "answers": ["Струны", "Клавиши пианино", "Колёса"], "source": "https://ar.culture.ru/ru/subject/velikiy-krez", "kind": "choice"}, {"title": "Пора подвигаться!", "text": "В удмуртской танцевальной традиции есть хороводы. Участники могут двигаться по кругу и хлопать в ладоши.", "art": "dance", "q": "Игровая разминка: повтори последовательность. Это упражнение, а не запись народного танца.", "answers": ["Хлопок", "Шаг", "Хлопок"], "source": "https://kpfu.ru/portal/docs/F2048259860/Sbornik.statej.T3.pdf", "kind": "rhythm"}, {"title": "Гербер", "text": "Гербер связан с окончанием посевных работ. На праздниках можно встретить песни, игры и угощения.", "art": "sprout", "q": "С какими занятиями связан Гербер?", "answers": ["С посевом растений", "С запуском ракет", "С подводным плаванием"], "source": "https://udmurtiatravel.visitudmurtia.org/etno", "kind": "choice"}]}, {"id": "ma", "name": "Марийцы", "color": "#e45392", "tag": "Три слоя и праздник цветов", "cards": [{"title": "Салам!", "text": "Так можно поздороваться на марийском языке. По-русски это значит «Привет». Улыбнись и помаши новому другу!", "art": "hello", "q": "Что мы делаем при встрече?", "answers": ["Здороваемся", "Прощаемся", "Засыпаем"], "source": "https://mari-centr.ru/node/2992", "kind": "choice"}, {"title": "Дом из дерева", "text": "В музее можно познакомиться со старинной марийской избой. Люди строили деревянные дома и хранили в них вещи для повседневной жизни. Современные дома бывают разными.", "art": "house", "q": "Из чего строили такую избу?", "answers": ["Из дерева", "Из снега", "Из шоколада"], "source": "https://ethnomuseum.ru/exposition/permanent/volga_urals/", "kind": "choice"}, {"title": "Коман-мелна", "text": "Коман-мелна — традиционные трёхслойные блины. Посмотри, как один слой лежит на другом!", "art": "layers", "q": "Сколько слоёв у такого блина?", "answers": ["3", "1", "5"], "source": "https://www.culture.ru/materials/253362/samobytnaya-rossiya-mari", "kind": "choice"}, {"title": "Звучат гусли", "text": "Марийские музыканты играют на гуслях — струнном инструменте. На выступлениях можно услышать песни и инструментальные мелодии.", "art": "strings", "q": "Какой это инструмент?", "answers": ["Струнный", "Духовой", "Ударный"], "source": "https://rnmc-rme.ru/o-nas/kollektivy/peledysh-tsvetok/", "kind": "choice"}, {"title": "Пора подвигаться!", "text": "Один из марийских танцев — «Кандыра», или «Верёвочка». Танцоры могут образовывать длинную цепочку. А мы потренируемся повторять движения.", "art": "dance", "q": "Игровая разминка: повтори последовательность. Это упражнение, а не запись народного танца.", "answers": ["Хлопок", "Шаг", "Хлопок"], "source": "https://www.culture.ru/materials/253362/samobytnaya-rossiya-mari", "kind": "rhythm"}, {"title": "Пеледыш пайрем", "text": "Название Пеледыш пайрем означает «праздник цветов». Это праздник с песнями и танцами, связанный с весенне-летним временем и окончанием полевых работ.", "art": "flower", "q": "Что означает название праздника?", "answers": ["Праздник цветов", "Праздник снега", "Праздник кораблей"], "source": "https://www.ethnomuseum.ru/collections/ethnocalendar/june/peledysh-pajrem-prazdnik-cvetov-u-marijcev/", "kind": "choice"}]}, {"id": "ko", "name": "Коми-пермяки", "color": "#dc8122", "tag": "Пэляны и гостеприимное крыльцо", "cards": [{"title": "Бур лун!", "text": "Так можно поздороваться на коми-пермяцком языке. По-русски это значит «Добрый день». Улыбнись и помаши новому другу!", "art": "hello", "q": "Что мы делаем при встрече?", "answers": ["Здороваемся", "Прощаемся", "Засыпаем"], "source": "https://gppc.ru/wp-content/uploads/2023/11/metodicheskie_rekomendaczii_nedelya_psihologii.pdf", "kind": "choice"}, {"title": "На крыльце", "text": "В тёплое время года коми-пермяки часто проводили время на крыльце, обращённом во двор. Такую сцену показывает этнографический музей.", "art": "house", "q": "Где отдыхали в тёплую погоду?", "answers": ["На крыльце", "В сугробе", "На крыше поезда"], "source": "https://ethnomuseum.ru/exposition/permanent/volga_urals/", "kind": "choice"}, {"title": "Пельнянь", "text": "Пельмени занимают место в традиционной кухне коми-пермяков. Начинку заворачивают в тесто. Это блюдо любят и многие другие народы!", "art": "dumplings", "q": "Во что заворачивают начинку?", "answers": ["В тесто", "В бумагу", "В кожуру банана"], "source": "https://www.ipdn.ru/rics/va/_private/a38/111-119.pdf", "kind": "choice"}, {"title": "Пэляны", "text": "Пэляны — духовой инструмент из нескольких трубочек. Традиции игры на них сохраняют коми-пермяцкие музыканты.", "art": "pipes", "q": "Из чего состоит этот инструмент?", "answers": ["Из трубочек", "Из клавиш", "Из трёх струн"], "source": "https://www.culture.ru/objects/456/tradicii-igry-na-mnogostvolnykh-fleitakh-pelyanakh-komi-permyakov", "kind": "choice"}, {"title": "Пора подвигаться!", "text": "Коми-Пермяцкий ансамбль «Шондибан» знакомит зрителей с народным искусством. В игре мы разомнёмся, а настоящее выступление можно посмотреть вместе с воспитателем.", "art": "dance", "q": "Игровая разминка: повтори последовательность. Это упражнение, а не запись народного танца.", "answers": ["Хлопок", "Шаг", "Хлопок"], "source": "https://www.etnokpo.ru/center", "kind": "rhythm"}, {"title": "Праздник льна", "text": "Этнокультурный центр проводит «Лён вежалун» — праздник льна. Из льняных волокон делают нити, а из нитей — ткань.", "art": "sprout", "q": "Что можно сделать из льняных нитей?", "answers": ["Ткань", "Стекло", "Камень"], "source": "https://www.etnokpo.ru/center", "kind": "choice"}]}, {"id": "mn", "name": "Манси", "color": "#386bca", "tag": "Речные истории и Вороний день", "cards": [{"title": "Пася олэн!", "text": "Так можно поздороваться на мансийском языке. По-русски это значит «Здравствуйте». Улыбнись и помаши новому другу!", "art": "hello", "q": "Что мы делаем при встрече?", "answers": ["Здороваемся", "Прощаемся", "Засыпаем"], "source": "https://ouipiir.ru/node/78", "kind": "choice"}, {"title": "Дома у реки", "text": "Мансийские поселения часто располагались у рек. Жилища были разными: встречались бревенчатые дома, временные промысловые жилища, а у части оленеводов — чумы.", "art": "house", "q": "Возле чего часто строили поселения?", "answers": ["Возле реки", "Внутри вулкана", "На айсберге"], "source": "https://www.atlaskmns.ru/page/ru/people_mansi_matcult.html", "kind": "choice"}, {"title": "Рыба и ягоды", "text": "В традиционной кухне манси важное место занимает рыба. Из неё варят суп. Собирают и лесные ягоды — например, бруснику и чернику.", "art": "fish", "q": "Что используют для рыбного супа?", "answers": ["Рыбу", "Какао", "Бананы"], "source": "https://www.atlaskmns.ru/page/ru/people_mansi_matcult.html", "kind": "choice"}, {"title": "Санквылтап", "text": "Санквылтап — струнный инструмент, известный у манси и хантов. Его деревянному корпусу мастера придавали форму лодки или рыбы.", "art": "boatstrings", "q": "На что может быть похож корпус?", "answers": ["На лодку", "На воздушный шар", "На кубик"], "source": "https://ar.culture.ru/ru/subject/sankvyltap-1", "kind": "choice"}, {"title": "Пора подвигаться!", "text": "У народов есть свои танцевальные традиции. Для знакомства с танцами манси нужен показ исполнителей. Пока поиграем в движения, не изображая обрядовый танец.", "art": "dance", "q": "Игровая разминка: повтори последовательность. Это упражнение, а не запись народного танца.", "answers": ["Хлопок", "Шаг", "Хлопок"], "source": "https://www.somb.ru/virtualnaya-gostinaya-4/virtualnye-programmy/1492-virtualnaya-informatsionnaya-programma-narody-srednego-urala-mansi.html", "kind": "rhythm"}, {"title": "Вороний день", "text": "У северных манси есть праздник встречи весны — Вороний день. Прилёт вороны связан с пробуждением природы. Такой праздник есть и у хантов.", "art": "bird", "q": "Какую птицу вспоминают в названии?", "answers": ["Ворону", "Пингвина", "Павлина"], "source": "https://www.somb.ru/virtualnaya-gostinaya-4/virtualnye-programmy/1492-virtualnaya-informatsionnaya-programma-narody-srednego-urala-mansi.html", "kind": "choice"}]}];

else if(type==='dance')b='<path d="M65 137q-14-48 11-64 26 7 17 54-6 29-28 10M189 97q-13-48 12-64 26 7 17 54-6 29-29 10" fill="#e6a05f"/><path d="M144 143l22-1-2-20m2 20-31-28" fill="none" stroke="#64a99a" stroke-width="7" stroke-linecap="round"/><circle cx="77" cy="157" r="13" fill="#e6a05f"/><circle cx="202" cy="117" r="13" fill="#e6a05f"/>';
else b='<text x="150" y="135" font-size="110" text-anchor="middle" fill="#4f9f92">♫</text>';
return svg(b)}
function scenery(){return `<svg class="scenery" viewBox="0 0 1200 350" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1200" height="350" fill="#c8ebee"/><circle cx="1020" cy="70" r="39" fill="#ffe393"/><path d="M520 290L780 30 1000 260 1150 80 1310 300" fill="#91bdb6"/><path d="M730 80l50-50 65 68-64-23zM1110 126l40-46 45 60-47-20z" fill="#e6f2e9"/><path d="M0 286Q230 180 530 274T1200 229V350H0z" fill="#94c998"/><path d="M0 330Q350 220 760 303T1250 285V350H0z" fill="#72b68e"/><path d="M900 250q-80 45-25 65l-75 35h160l-37-35q-70-30 1-65" fill="#87d5db"/>${[1000,1070,1140,720].map((x,i)=>`<path d="M${x} ${150+i*16}l-27 57h16l-24 37h70l-24-37h16z" fill="#3e8c73"/><path d="M${x+4} ${225+i*16}v35" stroke="#427b65" stroke-width="7"/>`).join('')}</svg>`}

function photoData(p,t){const id=DATA[p].id;return PHOTOS[id+'-'+(['greeting','home','food','music','dance','festival'][t])]}
function photoImage(x,mode='card'){return `<img src="${esc(x.url)}" alt="${esc(x.caption)}" loading="lazy" referrerpolicy="no-referrer" data-photo-image="true">`}
function photoPanel(p,t){const x=photoData(p,t);return `<button class="photo-open" data-action="zoom" aria-label="Увеличить фотографию">${photoImage(x)}<span>⤢ Рассмотреть ближе</span></button><div class="caption">${esc(x.caption)}<a class="photo-credit" href="${esc(x.page)}" target="_blank" rel="noopener noreferrer">Источник фотографии ↗</a></div>`}
function zoomPhoto(){const x=photoData(state.person,state.topic),d=document.createElement('dialog');d.className='photo-zoom';d.innerHTML=`<div class="close-row"><button aria-label="Закрыть фотографию">Закрыть ✕</button></div>${photoImage(x)}<div class="caption">${esc(x.caption)}<a class="photo-credit" href="${esc(x.page)}" target="_blank" rel="noopener noreferrer">Источник фотографии ↗</a></div>`;document.body.append(d);d.querySelector('button').onclick=()=>d.close();d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close()});d.showModal()}
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement&&e.target.dataset.photoImage){const m=document.createElement('div');m.className='photo-error';m.textContent='Фото недоступно. Откройте источник фотографии.';e.target.replaceWith(m)}},true);

function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();if(audio){audio.pause();audio=null}}
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').textContent='',5500)}
function speak(text){stop();if(!('speechSynthesis'in window)){toast('Озвучка не поддерживается этим браузером. Прочитайте текст вместе.');return}const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.83;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ru'));if(v)u.voice=v;u.onerror=()=>toast('Не удалось воспроизвести речь. Проверьте голосовые настройки устройства.');speechSynthesis.speak(u)}
function save(){try{localStorage.setItem('ural-discoveries-v1',JSON.stringify(progress))}catch{toast('Открытия сохранятся только до закрытия страницы.')}}
function earn(){progress[key(state.person,state.topic)]=true;save()}
function go(page,p=state.person,t=state.topic){stop();state={page,person:p,topic:t};step=0;render();window.scrollTo({top:0,behavior:'instant'});app.setAttribute('tabindex','-1');app.focus({preventScroll:true})}
function render(){document.documentElement.style.setProperty('--accent',DATA[state.person].color);
if(state.page==='home'){app.innerHTML=`<section class="hero">${scenery()}<div class="hero-copy"><span class="pill">Большое путешествие для маленьких исследователей · 5–7 лет</span><h1>Соседи. Друзья.<br>Удивительный Урал!</h1><p>Давай знакомиться с народами, узнавать традиции и собирать открытия.</p>${btn('start','Начать путешествие →','primary')}</div></section><div class="section-row"><h2>К кому отправимся в гости?</h2><span class="status">✦ ${total()} из 42 открытий</span></div><div class="grid">${DATA.map((p,i)=>`<button class="people" data-action="person" data-person="${i}" style="--tint:${p.color}18;--color:${p.color}"><span class="picture">${photoImage(PHOTOS[p.id+'-cover'])}</span><span class="copy"><strong>${p.name}</strong><small>${p.tag}</small><span class="meter"><span style="width:${count(i)/6*100}%"></span></span><small>${count(i)} из 6 открытий</small></span></button>`).join('')}</div><p class="intro-note">На Урале живут многие народы. Здесь пока семь маршрутов — это начало знакомства. Традиции могут различаться у разных семей. На фотографиях — музейные экспозиции, блюда и участники культурных событий. Праздничный костюм не означает повседневную одежду всех людей этого народа.</p>`}
else if(state.page==='person'){const p=DATA[state.person];app.innerHTML=`<section class="route-head"><div><div class="eyebrow">Маршрут ${state.person+1} / 7</div><h1>${p.name}</h1><p>Выбери тему. Каждое задание — новое открытие!</p><div style="margin-top:16px">${btn('name','🔊 Послушать название','soft')}</div></div><div class="avatar">${photoImage(PHOTOS[p.id+'-cover'])}</div></section><div class="topics">${p.cards.map((c,i)=>`<button class="topic" data-action="topic" data-topic="${i}" style="--tint:${['#fff0c7','#ddf2df','#ffe6d9','#e7e1fa','#ffe1ed','#dcf0fa'][i]}">${progress[key(state.person,i)]?'<span class="check" aria-label="Открытие получено">✓</span>':''}<span class="art">${photoImage(photoData(state.person,i))}</span><strong>${labels[i]}</strong><small>${esc(c.title)}</small></button>`).join('')}</div>`}
else if(state.page==='lesson'){const p=DATA[state.person],c=p.cards[state.topic];answerOrder=c.answers.map((a,i)=>({a,i}));for(let i=answerOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[answerOrder[i],answerOrder[j]]=[answerOrder[j],answerOrder[i]]}app.innerHTML=`${btn('person','← Все темы: '+p.name,'soft',`data-person="${state.person}"`)}<section class="lesson"><div class="lesson-art">${photoPanel(state.person,state.topic)}</div><div><div class="eyebrow">${labels[state.topic]} · ${state.topic+1} / 6</div><h1 class="${state.topic===0?'greeting':''}">${esc(c.title)}</h1><p class="story">${esc(c.text)}</p>${btn('read','🔊 Послушать рассказ','primary')} ${btn('stop','⏹ Стоп','soft')}<p class="speech-note">Русский текст читает голос устройства.</p>${[0,3].includes(state.topic)?`<div id="nativeAudio"><small>Проверяем запись…</small></div>`:''}</div></section><section class="activities"><div class="eyebrow">Попробуем вместе</div><h2>${esc(c.q)}</h2>${c.kind==='rhythm'?`<div class="rhythm">${c.answers.map((s,i)=>`<span class="step ${i===0?'current':''}" data-step="${i}">${s==='Хлопок'?'👏':'👣'} ${s}</span>`).join('')}</div><div class="answers">${btn('rhythm','👏 Хлопок','','data-value="Хлопок"')}${btn('rhythm','👣 Шаг','','data-value="Шаг"')}</div>`:`<div class="answers">${answerOrder.map(x=>btn('answer',esc(x.a),'',`data-answer="${x.i}"`)).join('')}</div>`}<p id="feedback" class="feedback" role="status" aria-live="polite"></p><div class="bottom">${btn('question','🔊 Послушать задание','soft')}${btn('next','Следующая тема →','primary')}</div></section>`;if([0,3].includes(state.topic))showAudio()}
else if(state.page==='album'){app.innerHTML=`<section class="hero" style="min-height:190px">${scenery()}<div class="hero-copy"><span class="pill">Маленькие шаги — большие открытия</span><h1>Мой альбом</h1><p>Собрано ${total()} из 42 открытий. Можно возвращаться к любимым темам!</p></div></section><div class="album">${DATA.map((p,i)=>`<section class="album-card"><h2>${p.name}</h2><div class="stickers">${p.cards.map((c,t)=>`<button class="sticker ${progress[key(i,t)]?'earned':''}" title="${labels[t]}: ${progress[key(i,t)]?'открыто':'ещё впереди'}" aria-label="${p.name}. ${labels[t]}. ${progress[key(i,t)]?'Открыто':'Ещё впереди'}" data-action="open" data-person="${i}" data-topic="${t}">${emoji[t]}</button>`).join('')}</div></section>`).join('')}</div>`}
else teacher();app.innerHTML+=`<footer class="footer"><span>Урал: давай знакомиться! · Фотопутешествие</span><span><a href="./">Считай-ка!</a> · <a href="sounds.html">Звуковая мастерская</a></span></footer>`}
function teacher(){const p=DATA[state.person];app.innerHTML=`<section class="teacher"><div class="eyebrow">Взрослым</div><h1>Открываем мир вместе</h1><p>Семь народов, 42 небольшие темы. Выберите один маршрут и обсуждайте его без спешки. После задания ребёнок получает отметку в альбоме. Ошибки не отнимают открытия.</p><ul><li>Фотографии показывают конкретные экспонаты, блюда и события. Под каждой указаны пояснение и источник. Сценический костюм, музейная реконструкция и традиционный предмет подписаны отдельно. Все изображения загружаются с внешних сайтов, поэтому нужен интернет. У народов есть современная жизнь; исторический быт — лишь часть знакомства.</li><li>Разминки — авторские игровые упражнения, не уроки национальной хореографии. Видео танцев и записи инструментов в эту версию не встроены.</li><li>Русский голос зависит от браузера и установленных голосов. Приветствия на других языках не читаются русским синтезатором.</li><li>Альбом хранится в этом браузере. Можно сохранить резервную копию и перенести её на другое устройство.</li></ul><div class="nav">${btn('export','Скачать альбом','soft')}${btn('reset','Очистить альбом','soft')}</div><label>Восстановить альбом из файла<input type="file" id="importProgress" accept="application/json,.json"></label><h2>Записи носителей языка</h2><p>Готовых национальных записей пока нет. Здесь можно добавить своё аудио приветствия или звучания инструмента, если у вас есть разрешение его использовать. Файл сохранится только в этом браузере; исходник сохраните отдельно.</p><div class="nav">${DATA.map((d,i)=>btn('selectAudio',d.name,i===state.person?'primary':'soft',`data-person="${i}"`)).join('')}</div><div class="block"><h2>${p.name}</h2><label>Приветствие: ${esc(p.cards[0].title)}<input type="file" data-audio="0" accept="audio/*"></label><label>Музыкальный фрагмент<input type="file" data-audio="3" accept="audio/*"></label><p>До 15 МБ на запись. После загрузки кнопка прослушивания появится в соответствующей теме.</p>${btn('deleteAudio','Удалить записи этого маршрута','soft')}</div><h2>Материалы для подготовки занятия</h2><p>Ссылки открывают материалы учреждений, музеев, энциклопедий и исследователей. Материалы по всему народу не означают, что каждая традиция встречается у всех его региональных групп.</p>${DATA.map(p=>`<details class="block"><summary>${p.name}</summary><ul>${p.cards.map((c,i)=>`<li><a href="${esc(c.source)}" target="_blank" rel="noopener noreferrer">${labels[i]}: ${esc(c.title)}</a></li>`).join('')}</ul></details>`).join('')}</section>`}
function openDB(){if(db)return Promise.resolve(db);return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('no indexedDB'));const r=indexedDB.open('ural-audio-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
async function clip(k,mode='get',value){const d=await openDB();return new Promise((resolve,reject)=>{const tx=d.transaction('clips',mode==='get'?'readonly':'readwrite'),s=tx.objectStore('clips');let r=mode==='put'?s.put(value,k):mode==='delete'?s.delete(k):s.get(k);tx.oncomplete=()=>resolve(r.result);tx.onerror=()=>reject(tx.error)})}
async function showAudio(){const k=key(state.person,state.topic),topic=state.topic;let blob;try{blob=await clip(k)}catch{}if(state.page!=='lesson'||key(state.person,state.topic)!==k)return;const el=document.getElementById('nativeAudio');if(el)el.innerHTML=blob?btn('native',topic===0?'▶ Приветствие на родном языке':'▶ Послушать музыкальную запись','soft'):`<small class="muted">${topic===0?'Запись приветствия носителем языка':'Запись музыки'} пока не добавлена. Её можно загрузить в разделе «Для педагога».</small>`}
async function playClip(){stop();try{const blob=await clip(key(state.person,state.topic));if(!blob){toast('Запись пока не добавлена.');return}const url=URL.createObjectURL(blob);audio=new Audio(url);audio.onended=()=>URL.revokeObjectURL(url);audio.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось прочитать аудиофайл.')};await audio.play()}catch{toast('Не удалось воспроизвести запись.')}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,p=Number(b.dataset.person??state.person),t=Number(b.dataset.topic??state.topic);if(a==='zoom'){zoomPhoto();return}if(['home','album','teacher'].includes(a))go(a);else if(a==='start')go('person',0);else if(a==='person')go('person',p);else if(a==='topic')go('lesson',state.person,t);else if(a==='open')go('lesson',p,t);else if(a==='selectAudio')go('teacher',p);else if(a==='name')speak(DATA[p].name);else if(a==='read')speak((state.topic===0?'':DATA[p].cards[t].title+'. ')+DATA[p].cards[t].text);else if(a==='stop')stop();else if(a==='question'){const c=DATA[p].cards[t];speak(c.q+(c.kind==='choice'?' Варианты: '+answerOrder.map(x=>x.a).join('. '):''))}else if(a==='native')playClip();else if(a==='next'){if(t===5)go('album');else go('lesson',p,t+1)}else if(a==='answer'){const good=Number(b.dataset.answer)===0;b.classList.add(good?'correct':'wrong');document.getElementById('feedback').textContent=good?'Верно! Новое открытие в твоём альбоме ✦':'Давай подумаем ещё. Подсказка — в рассказе выше.';if(good){earn();app.querySelectorAll('[data-action="answer"]').forEach(x=>x.disabled=true)}}else if(a==='rhythm'){const c=DATA[p].cards[t];if(step>=c.answers.length)return;const f=document.getElementById('feedback');if(b.dataset.value===c.answers[step]){const s=app.querySelector(`[data-step="${step}"]`);s.classList.remove('current');s.classList.add('done');step++;app.querySelector(`[data-step="${step}"]`)?.classList.add('current');f.textContent=step===3?'Получилось! Открытие добавлено в альбом ✦':'Верно! Теперь следующее движение.';if(step===3){earn();app.querySelectorAll('[data-action="rhythm"]').forEach(x=>x.disabled=true)}}else f.textContent='Посмотри на выделенное движение и попробуй ещё раз.'}else if(a==='export'){const blob=new Blob([JSON.stringify({version:1,progress},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='ural-album.json';x.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}else if(a==='reset'){if(confirm('Очистить все открытия на этом устройстве? Аудиозаписи останутся.')){progress={};save();toast('Альбом очищен.')}}else if(a==='deleteAudio'){if(confirm('Удалить две аудиозаписи этого маршрута из браузера?'))try{await clip(key(p,0),'delete');await clip(key(p,3),'delete');toast('Записи удалены.')}catch{toast('Не удалось удалить записи.')}}});
document.addEventListener('change',async e=>{const input=e.target;if(input.dataset.audio!==undefined){const f=input.files[0],p=state.person;if(!f)return;if(f.size>15*1024*1024||!f.type.startsWith('audio/')){toast('Выберите аудиофайл размером до 15 МБ.');input.value='';return}try{await clip(key(p,Number(input.dataset.audio)),'put',f);toast('Запись сохранена для маршрута «'+DATA[p].name+'».')}catch{toast('Браузер не смог сохранить аудио. Проверьте доступное место.')}}else if(input.id==='importProgress'){try{const data=JSON.parse(await input.files[0].text());if(data.version!==1||!data.progress||typeof data.progress!=='object')throw Error();const next={};DATA.forEach((p,i)=>p.cards.forEach((_,t)=>{if(data.progress[key(i,t)]===true)next[key(i,t)]=true}));progress=next;save();toast('Альбом восстановлен.')}catch{toast('Файл не подходит. Выберите резервную копию альбома.')}}});
window.addEventListener('pagehide',stop);render();
</script></body></html>
