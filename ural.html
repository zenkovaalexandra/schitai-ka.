else if(type==='dance')b='<path d="M65 137q-14-48 11-64 26 7 17 54-6 29-28 10M189 97q-13-48 12-64 26 7 17 54-6 29-29 10" fill="#e6a05f"/><path d="M144 143l22-1-2-20m2 20-31-28" fill="none" stroke="#64a99a" stroke-width="7" stroke-linecap="round"/><circle cx="77" cy="157" r="13" fill="#e6a05f"/><circle cx="202" cy="117" r="13" fill="#e6a05f"/>';
else b='<text x="150" y="135" font-size="110" text-anchor="middle" fill="#4f9f92">♫</text>';
return svg(b)}
function scenery(){return `<svg class="scenery" viewBox="0 0 1200 350" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1200" height="350" fill="#c8ebee"/><circle cx="1020" cy="70" r="39" fill="#ffe393"/><path d="M520 290L780 30 1000 260 1150 80 1310 300" fill="#91bdb6"/><path d="M730 80l50-50 65 68-64-23zM1110 126l40-46 45 60-47-20z" fill="#e6f2e9"/><path d="M0 286Q230 180 530 274T1200 229V350H0z" fill="#94c998"/><path d="M0 330Q350 220 760 303T1250 285V350H0z" fill="#72b68e"/><path d="M900 250q-80 45-25 65l-75 35h160l-37-35q-70-30 1-65" fill="#87d5db"/>${[1000,1070,1140,720].map((x,i)=>`<path d="M${x} ${150+i*16}l-27 57h16l-24 37h70l-24-37h16z" fill="#3e8c73"/><path d="M${x+4} ${225+i*16}v35" stroke="#427b65" stroke-width="7"/>`).join('')}</svg>`}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();if(audio){audio.pause();audio=null}}
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').textContent='',5500)}
function speak(text){stop();if(!('speechSynthesis'in window)){toast('Озвучка не поддерживается этим браузером. Прочитайте текст вместе.');return}const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.83;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ru'));if(v)u.voice=v;u.onerror=()=>toast('Не удалось воспроизвести речь. Проверьте голосовые настройки устройства.');speechSynthesis.speak(u)}
function save(){try{localStorage.setItem('ural-discoveries-v1',JSON.stringify(progress))}catch{toast('Открытия сохранятся только до закрытия страницы.')}}
function earn(){progress[key(state.person,state.topic)]=true;save()}
function go(page,p=state.person,t=state.topic){stop();state={page,person:p,topic:t};step=0;render();window.scrollTo({top:0,behavior:'instant'});app.setAttribute('tabindex','-1');app.focus({preventScroll:true})}
function render(){document.documentElement.style.setProperty('--accent',DATA[state.person].color);
if(state.page==='home'){app.innerHTML=`<section class="hero">${scenery()}<div class="hero-copy"><span class="pill">Большое путешествие для маленьких исследователей · 5–7 лет</span><h1>Соседи. Друзья.<br>Удивительный Урал!</h1><p>Давай знакомиться с народами, узнавать традиции и собирать открытия.</p>${btn('start','Начать путешествие →','primary')}</div></section><div class="section-row"><h2>К кому отправимся в гости?</h2><span class="status">✦ ${total()} из 42 открытий</span></div><div class="grid">${DATA.map((p,i)=>`<button class="people" data-action="person" data-person="${i}" style="--tint:${p.color}18;--color:${p.color}"><span class="picture">${child(p.color)}</span><span class="copy"><strong>${p.name}</strong><small>${p.tag}</small><span class="meter"><span style="width:${count(i)/6*100}%"></span></span><small>${count(i)} из 6 открытий</small></span></button>`).join('')}</div><p class="intro-note">На Урале живут многие народы. Здесь пока семь маршрутов — это начало знакомства. Традиции могут различаться у разных семей. Наши нарисованные проводники — вымышленные современные дети.</p>`}
else if(state.page==='person'){const p=DATA[state.person];app.innerHTML=`<section class="route-head"><div><div class="eyebrow">Маршрут ${state.person+1} / 7</div><h1>${p.name}</h1><p>Выбери тему. Каждое задание — новое открытие!</p><div style="margin-top:16px">${btn('name','🔊 Послушать название','soft')}</div></div><div class="avatar">${child(p.color)}</div></section><div class="topics">${p.cards.map((c,i)=>`<button class="topic" data-action="topic" data-topic="${i}" style="--tint:${['#fff0c7','#ddf2df','#ffe6d9','#e7e1fa','#ffe1ed','#dcf0fa'][i]}">${progress[key(state.person,i)]?'<span class="check" aria-label="Открытие получено">✓</span>':''}<span class="art">${art(c.art)}</span><strong>${labels[i]}</strong><small>${esc(c.title)}</small></button>`).join('')}</div>`}
else if(state.page==='lesson'){const p=DATA[state.person],c=p.cards[state.topic];answerOrder=c.answers.map((a,i)=>({a,i}));for(let i=answerOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[answerOrder[i],answerOrder[j]]=[answerOrder[j],answerOrder[i]]}app.innerHTML=`${btn('person','← Все темы: '+p.name,'soft',`data-person="${state.person}"`)}<section class="lesson"><div class="lesson-art">${art(c.art)}<span class="caption">Условная иллюстрация для знакомства</span></div><div><div class="eyebrow">${labels[state.topic]} · ${state.topic+1} / 6</div><h1 class="${state.topic===0?'greeting':''}">${esc(c.title)}</h1><p class="story">${esc(c.text)}</p>${btn('read','🔊 Послушать рассказ','primary')} ${btn('stop','⏹ Стоп','soft')}<p class="speech-note">Русский текст читает голос устройства.</p>${[0,3].includes(state.topic)?`<div id="nativeAudio"><small>Проверяем запись…</small></div>`:''}</div></section><section class="activities"><div class="eyebrow">Попробуем вместе</div><h2>${esc(c.q)}</h2>${c.kind==='rhythm'?`<div class="rhythm">${c.answers.map((s,i)=>`<span class="step ${i===0?'current':''}" data-step="${i}">${s==='Хлопок'?'👏':'👣'} ${s}</span>`).join('')}</div><div class="answers">${btn('rhythm','👏 Хлопок','','data-value="Хлопок"')}${btn('rhythm','👣 Шаг','','data-value="Шаг"')}</div>`:`<div class="answers">${answerOrder.map(x=>btn('answer',esc(x.a),'',`data-answer="${x.i}"`)).join('')}</div>`}<p id="feedback" class="feedback" role="status" aria-live="polite"></p><div class="bottom">${btn('question','🔊 Послушать задание','soft')}${btn('next','Следующая тема →','primary')}</div></section>`;if([0,3].includes(state.topic))showAudio()}
else if(state.page==='album'){app.innerHTML=`<section class="hero" style="min-height:190px">${scenery()}<div class="hero-copy"><span class="pill">Маленькие шаги — большие открытия</span><h1>Мой альбом</h1><p>Собрано ${total()} из 42 открытий. Можно возвращаться к любимым темам!</p></div></section><div class="album">${DATA.map((p,i)=>`<section class="album-card"><h2>${p.name}</h2><div class="stickers">${p.cards.map((c,t)=>`<button class="sticker ${progress[key(i,t)]?'earned':''}" title="${labels[t]}: ${progress[key(i,t)]?'открыто':'ещё впереди'}" aria-label="${p.name}. ${labels[t]}. ${progress[key(i,t)]?'Открыто':'Ещё впереди'}" data-action="open" data-person="${i}" data-topic="${t}">${emoji[t]}</button>`).join('')}</div></section>`).join('')}</div>`}
else teacher();app.innerHTML+=`<footer class="footer"><span>Урал: давай знакомиться! · Первая рабочая версия</span><span><a href="./">Считай-ка!</a> · <a href="sounds.html">Звуковая мастерская</a></span></footer>`}
function teacher(){const p=DATA[state.person];app.innerHTML=`<section class="teacher"><div class="eyebrow">Взрослым</div><h1>Открываем мир вместе</h1><p>Семь народов, 42 небольшие темы. Выберите один маршрут и обсуждайте его без спешки. После задания ребёнок получает отметку в альбоме. Ошибки не отнимают открытия.</p><ul><li>Иллюстрации условные: это не точные музейные реконструкции. У всех народов есть современная жизнь, а старинные дома и предметы показаны как примеры традиций.</li><li>Разминки — авторские игровые упражнения, не уроки национальной хореографии. Видео танцев и записи инструментов в эту версию не встроены.</li><li>Русский голос зависит от браузера и установленных голосов. Приветствия на других языках не читаются русским синтезатором.</li><li>Альбом хранится в этом браузере. Можно сохранить резервную копию и перенести её на другое устройство.</li></ul><div class="nav">${btn('export','Скачать альбом','soft')}${btn('reset','Очистить альбом','soft')}</div><label>Восстановить альбом из файла<input type="file" id="importProgress" accept="application/json,.json"></label><h2>Записи носителей языка</h2><p>Готовых национальных записей пока нет. Здесь можно добавить своё аудио приветствия или звучания инструмента, если у вас есть разрешение его использовать. Файл сохранится только в этом браузере; исходник сохраните отдельно.</p><div class="nav">${DATA.map((d,i)=>btn('selectAudio',d.name,i===state.person?'primary':'soft',`data-person="${i}"`)).join('')}</div><div class="block"><h2>${p.name}</h2><label>Приветствие: ${esc(p.cards[0].title)}<input type="file" data-audio="0" accept="audio/*"></label><label>Музыкальный фрагмент<input type="file" data-audio="3" accept="audio/*"></label><p>До 15 МБ на запись. После загрузки кнопка прослушивания появится в соответствующей теме.</p>${btn('deleteAudio','Удалить записи этого маршрута','soft')}</div><h2>Материалы для подготовки занятия</h2><p>Ссылки открывают материалы учреждений, музеев, энциклопедий и исследователей. Материалы по всему народу не означают, что каждая традиция встречается у всех его региональных групп.</p>${DATA.map(p=>`<details class="block"><summary>${p.name}</summary><ul>${p.cards.map((c,i)=>`<li><a href="${esc(c.source)}" target="_blank" rel="noopener noreferrer">${labels[i]}: ${esc(c.title)}</a></li>`).join('')}</ul></details>`).join('')}</section>`}
function openDB(){if(db)return Promise.resolve(db);return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('no indexedDB'));const r=indexedDB.open('ural-audio-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
async function clip(k,mode='get',value){const d=await openDB();return new Promise((resolve,reject)=>{const tx=d.transaction('clips',mode==='get'?'readonly':'readwrite'),s=tx.objectStore('clips');let r=mode==='put'?s.put(value,k):mode==='delete'?s.delete(k):s.get(k);tx.oncomplete=()=>resolve(r.result);tx.onerror=()=>reject(tx.error)})}
async function showAudio(){const k=key(state.person,state.topic),topic=state.topic;let blob;try{blob=await clip(k)}catch{}if(state.page!=='lesson'||key(state.person,state.topic)!==k)return;const el=document.getElementById('nativeAudio');if(el)el.innerHTML=blob?btn('native',topic===0?'▶ Приветствие на родном языке':'▶ Послушать музыкальную запись','soft'):`<small class="muted">${topic===0?'Запись приветствия носителем языка':'Запись музыки'} пока не добавлена. Её можно загрузить в разделе «Для педагога».</small>`}
async function playClip(){stop();try{const blob=await clip(key(state.person,state.topic));if(!blob){toast('Запись пока не добавлена.');return}const url=URL.createObjectURL(blob);audio=new Audio(url);audio.onended=()=>URL.revokeObjectURL(url);audio.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось прочитать аудиофайл.')};await audio.play()}catch{toast('Не удалось воспроизвести запись.')}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,p=Number(b.dataset.person??state.person),t=Number(b.dataset.topic??state.topic);if(['home','album','teacher'].includes(a))go(a);else if(a==='start')go('person',0);else if(a==='person')go('person',p);else if(a==='topic')go('lesson',state.person,t);else if(a==='open')go('lesson',p,t);else if(a==='selectAudio')go('teacher',p);else if(a==='name')speak(DATA[p].name);else if(a==='read')speak((state.topic===0?'':DATA[p].cards[t].title+'. ')+DATA[p].cards[t].text);else if(a==='stop')stop();else if(a==='question'){const c=DATA[p].cards[t];speak(c.q+(c.kind==='choice'?' Варианты: '+answerOrder.map(x=>x.a).join('. '):''))}else if(a==='native')playClip();else if(a==='next'){if(t===5)go('album');else go('lesson',p,t+1)}else if(a==='answer'){const good=Number(b.dataset.answer)===0;b.classList.add(good?'correct':'wrong');document.getElementById('feedback').textContent=good?'Верно! Новое открытие в твоём альбоме ✦':'Давай подумаем ещё. Подсказка — в рассказе выше.';if(good){earn();app.querySelectorAll('[data-action="answer"]').forEach(x=>x.disabled=true)}}else if(a==='rhythm'){const c=DATA[p].cards[t];if(step>=c.answers.length)return;const f=document.getElementById('feedback');if(b.dataset.value===c.answers[step]){const s=app.querySelector(`[data-step="${step}"]`);s.classList.remove('current');s.classList.add('done');step++;app.querySelector(`[data-step="${step}"]`)?.classList.add('current');f.textContent=step===3?'Получилось! Открытие добавлено в альбом ✦':'Верно! Теперь следующее движение.';if(step===3){earn();app.querySelectorAll('[data-action="rhythm"]').forEach(x=>x.disabled=true)}}else f.textContent='Посмотри на выделенное движение и попробуй ещё раз.'}else if(a==='export'){const blob=new Blob([JSON.stringify({version:1,progress},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='ural-album.json';x.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}else if(a==='reset'){if(confirm('Очистить все открытия на этом устройстве? Аудиозаписи останутся.')){progress={};save();toast('Альбом очищен.')}}else if(a==='deleteAudio'){if(confirm('Удалить две аудиозаписи этого маршрута из браузера?'))try{await clip(key(p,0),'delete');await clip(key(p,3),'delete');toast('Записи удалены.')}catch{toast('Не удалось удалить записи.')}}});
document.addEventListener('change',async e=>{const input=e.target;if(input.dataset.audio!==undefined){const f=input.files[0],p=state.person;if(!f)return;if(f.size>15*1024*1024||!f.type.startsWith('audio/')){toast('Выберите аудиофайл размером до 15 МБ.');input.value='';return}try{await clip(key(p,Number(input.dataset.audio)),'put',f);toast('Запись сохранена для маршрута «'+DATA[p].name+'».')}catch{toast('Браузер не смог сохранить аудио. Проверьте доступное место.')}}else if(input.id==='importProgress'){try{const data=JSON.parse(await input.files[0].text());if(data.version!==1||!data.progress||typeof data.progress!=='object')throw Error();const next={};DATA.forEach((p,i)=>p.cards.forEach((_,t)=>{if(data.progress[key(i,t)]===true)next[key(i,t)]=true}));progress=next;save();toast('Альбом восстановлен.')}catch{toast('Файл не подходит. Выберите резервную копию альбома.')}}});
window.addEventListener('pagehide',stop);render();
</script></body></html>
